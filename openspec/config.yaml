schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  FogMap: Android-трекер с туманом войны поверх Яндекс MapKit.
  Только трекер (туман + фон-трекинг + статистика + импорт/экспорт GPX).
  Без квестов, артефактов, сюжета, рейтингов. Офлайн-first, все локально.
  Доки: docs/vision.md, docs/research-market.md, docs/tech-risks.md, docs/decisions.md.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  archive:
    guidance:
      - Всегда выполнять синхронизацию дельта-спеков в основные спеки перед архивацией; отдельный вопрос о синке не задавать (решение владельца зафиксировано).
      - "При архивации change принять решение о бампе версии по docs/versioning.md (MAJOR/MINOR/PATCH/NO_BUMP) — обновить файл version + CHANGELOG.md + строку Версия в docs/sessions.md одним шагом."
