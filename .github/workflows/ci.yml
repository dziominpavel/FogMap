name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: assemble release-arm
        env:
          # Без секрета сборка тоже зеленая: ключ пустой -> карта-заглушка (см. FogMapApp.isMapKitReady).
          # Чтобы CI-APK были с картой: Settings -> Secrets -> Actions -> MAPKIT_API_KEY.
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: ./gradlew :app:assembleRelease -PtargetAbis=arm64-v8a,armeabi-v7a --console=plain
      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FogMap-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
