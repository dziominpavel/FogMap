name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна для versionCode (git rev-list --count HEAD).
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Без android-actions/setup-android: ubuntu-раннеры уже содержат Android SDK
      # (и принятые лицензии), а экшен падал на скачивании cmdline-tools.
      # Недостающее AGP докачивает сам (так же ставит Build-Tools локально).
      - name: unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: assemble release-arm
        env:
          # Без секрета сборка тоже зеленая: ключ пустой -> карта-заглушка (см. FogMapApp.isMapKitReady).
          # Чтобы CI-APK были с картой: Settings -> Secrets -> Actions -> MAPKIT_API_KEY.
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: ./gradlew :app:assembleRelease -PtargetAbis=arm64-v8a,armeabi-v7a --console=plain
      - name: app version
        id: ver
        run: |
          FULLVER=$(./gradlew -q :app:printFullVersion --console=plain | grep '^FULL_VERSION=' | cut -d= -f2)
          echo "FULLVER=$FULLVER" >> "$GITHUB_OUTPUT"
      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FogMap-${{ steps.ver.outputs.FULLVER }}-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
